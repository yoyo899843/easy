version: '3.0'
services:
  gitlab.local:
    image: gitlab/gitlab-ce:12.9.2-ce.0
    hostname: gitlab.local
    ports:
    - 127.0.0.1:12345:80
    networks:
    - ctf_chals_network
  front:
    build: ./front
    ports:
    - 28880:80
    networks:
    - ctf_chals_network
networks:
  ctf_chals_network:
    external: true
