version: '2.2'
services:
  get-the-root:
    image: oalieno/ctf-python:sage
    networks:
    - ctf_chals_network
    volumes:
    - ./share:/home/ctf/
    - ./xinetd:/etc/xinetd.d/xinetd:ro
    ports:
    - 40001:9999
    expose:
    - '9999'
    restart: always

networks:
  ctf_chals_network:
    external: true
