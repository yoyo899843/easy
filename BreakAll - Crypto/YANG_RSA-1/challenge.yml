description: "RSA加密演算法是一種非對稱加密演算法，在公開金鑰加密和電子商業中RSA加密被廣泛使用。\n\n\n\nRSA的安全性是建立在大數分解的困難上，如果n不夠大就無法保證其安全性，對一極大整數做因數分解愈困難，RSA演算法愈可靠。\n\
