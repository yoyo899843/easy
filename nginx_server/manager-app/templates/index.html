<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Nginx Config Manager</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/theme/monokai.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #1e1e1e; color: #ccc; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; background: #2d2d2d; border-bottom: 1px solid #444; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; color: #fff; flex: 1; }
  button { padding: 7px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  #btn-save { background: #4caf50; color: #fff; }
  #btn-save:hover { background: #45a049; }
  #btn-save:disabled { background: #555; cursor: default; }
  .CodeMirror { flex: 1; height: 100%; font-size: 14px; line-height: 1.6; }
  #editor-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #status { padding: 8px 16px; background: #2d2d2d; border-top: 1px solid #444; font-size: 13px; min-height: 36px; white-space: pre-wrap; }
  #status.ok  { color: #4caf50; }
  #status.err { color: #f44336; }
</style>
</head>
<body>
<header>
  <h1>Nginx Config Manager</h1>
  <button id="btn-save">儲存並重載</button>
</header>
<div id="editor-wrap">
  <textarea id="editor">{{ content }}</textarea>
</div>
<div id="status">就緒</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/nginx/nginx.min.js"></script>
<script>
const cm = CodeMirror.fromTextArea(document.getElementById("editor"), {
  mode: "nginx",
  theme: "monokai",
  lineNumbers: true,
  indentUnit: 4,
  tabSize: 4,
  indentWithTabs: false,
  lineWrapping: false,
  autofocus: true,
});
cm.setSize("100%", "100%");

const status = document.getElementById("status");
const btn    = document.getElementById("btn-save");

btn.addEventListener("click", async () => {
  btn.disabled = true;
  status.className = "";
  status.textContent = "儲存中...";
  try {
    const res  = await fetch("/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: cm.getValue() }),
    });
    const data = await res.json();
    status.className = data.ok ? "ok" : "err";
    status.textContent = data.msg;
  } catch (e) {
    status.className = "err";
    status.textContent = "請求失敗：" + e;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
