description: "編碼與解碼是資訊領域日常都在使用的技術，如Ascii、Base64、Base32各有其適用處。   \n\nASCII(American Standard Code for Information Interchange)美國資訊交換標準代碼是基於拉丁字母的一套電腦編碼系統，它是現今最通用的單字元編碼系統。\n\
  \n\n\n請問你對Ascii編碼與解碼的技術了解嗎?   \n\n你知道如何解碼下列資料嗎:   \n\n```\n\n66 114 101 97 107 65 76 76 67 84 70 123 65 109 118 48 117 68\
  \ 121 101 114 118 80 116 109 86 114 57 83 83 83 75 125\n\n```\n\n\n\n\n\n看看維基百科的說明,來自我學習一下:   \n\nhttps://zh.wikipedia.org/wiki/ASCII\n\
  \n\n\n善用網路線上資源   \n\n試著用Google查察 ascii decoder"
