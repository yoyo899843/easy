version: '2.2'
services:
  pi:
    image: oalieno/ctf-python:crypto
    networks:
    - ctf_chals_network
    volumes:
    - ./share:/home/ctf/:ro
    - ./xinetd:/etc/xinetd.d/xinetd:ro
    ports:
    - 40007:9999
    expose:
    - '9999'
    restart: always

networks:
  ctf_chals_network:
    external: true
