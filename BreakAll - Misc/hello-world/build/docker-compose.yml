version: '2.2'
services:
  hello-world:
    build: ./image
    networks:
    - ctf_chals_network
    volumes:
    - ./share:/home/ctf/:ro
    ports:
    - 40012:9999
    expose:
    - '9999'
    restart: always
    entrypoint:
    - socat
    - TCP-LISTEN:9999,fork
    - EXEC:/home/ctf/run.sh

networks:
  ctf_chals_network:
    external: true
